<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillNova - Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a111a;
      color: #fff;
      min-height: 100vh;
      padding: 100px 20px 40px;
    }

    /* Navbar */
  .navbar {
      background: #0b131e;
      border-bottom: 1px solid #151e2d;
      padding: 16px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
    }
  .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
    }
  .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #00bfff 0%, #0099ff 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #0a111a;
    }
  .nav-links {
      display: flex;
      gap: 32px;
      align-items: center;
    }
  .nav-link {
      color: #7a8699;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s;
      padding: 8px 16px;
      border-radius: 8px;
    }
  .nav-link:hover {
      color: #00bfff;
      background: rgba(0, 191, 255, 0.1);
    }

    /* Sign Up Container */
  .signup-container {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }
  .signup-card {
      background: linear-gradient(135deg, #0b131e 0%, #0a111a 100%);
      border: 1px solid #151e2d;
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
  .signup-header {
      text-align: center;
      margin-bottom: 36px;
    }
  .signup-title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #00bfff 0%, #0099ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
  .signup-subtitle {
      font-size: 14px;
      color: #7a8699;
    }

    /* Form Styles */
  .form-group {
      margin-bottom: 20px;
    }
  .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
  .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #7a8699;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  .form-input {
      width: 100%;
      padding: 14px 18px;
      background: #0a111a;
      border: 1px solid #1f2937;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s;
      outline: none;
    }
  .form-input::placeholder {
      color: #4b5563;
    }
  .form-input:focus {
      border-color: #00bfff;
      background: #0b131e;
      box-shadow: 0 0 0 3px rgba(0, 191, 255, 0.1);
    }
  .password-wrapper {
      position: relative;
    }
  .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #7a8699;
      cursor: pointer;
      padding: 4px;
      transition: color 0.3s;
    }
  .password-toggle:hover {
      color: #00bfff;
    }
  .password-hint {
      font-size: 12px;
      color: #7a8699;
      margin-top: 6px;
    }

    /* Checkbox */
  .checkbox-wrapper {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 24px 0;
    }
  .checkbox {
      width: 18px;
      height: 18px;
      accent-color: #00bfff;
      cursor: pointer;
      margin-top: 2px;
    }
  .checkbox-label {
      font-size: 13px;
      color: #7a8699;
      line-height: 1.5;
    }
  .checkbox-label a {
      color: #00bfff;
      text-decoration: none;
    }
  .checkbox-label a:hover {
      text-decoration: underline;
    }

    /* Button */
  .btn-create {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #00bfff 0%, #0099ff 100%);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 16px rgba(0, 191, 255, 0.3);
    }
  .btn-create:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0, 191, 255, 0.5);
    }
  .btn-create:active {
      transform: translateY(0);
    }

    /* Divider */
  .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 28px 0;
    }
  .divider-line {
      flex: 1;
      height: 1px;
      background: #1f2937;
    }
  .divider-text {
      font-size: 13px;
      color: #7a8699;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Google Button */
  .btn-google {
      width: 100%;
      padding: 14px;
      background: #0a111a;
      border: 1px solid #1f2937;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
  .btn-google:hover {
      background: #0b131e;
      border-color: #00bfff;
    }

    /* Login Link */
  .login-text {
      text-align: center;
      margin-top: 28px;
      font-size: 14px;
      color: #7a8699;
    }
  .login-link {
      color: #00bfff;
      text-decoration: none;
      font-weight: 600;
    }
  .login-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
    .nav-links { display: none; }
    .navbar { padding: 16px 24px; }
    .signup-card { padding: 36px 28px; }
    .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="home.html" class="logo">
      <div class="logo-icon">S</div>
      <span>SkillNova</span>
    </a>
    <div class="nav-links">
      <a class="nav-link" href="home.html">Home</a>
      <a class="nav-link" href="dashboard.html">Dashboard</a>
      <a class="nav-link" href="skills.html">Skills</a>
      <a class="nav-link" href="roadmap.html">Roadmap</a>
      <a class="nav-link" href="progress.html">Progress</a>
      <a class="nav-link" href="salary.html">Salary</a>
      <a class="nav-link" href="personality.html">Personality</a>
    </div>
  </nav>

  <div class="signup-container">
    <div class="signup-card">
      <div class="signup-header">
        <h1 class="signup-title">Create Account</h1>
        <p class="signup-subtitle">Start your career journey for free</p>
      </div>

      <form id="signupForm">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">First Name</label>
            <input type="text" class="form-input" id="firstName" placeholder="John" required>
          </div>
          <div class="form-group">
            <label class="form-label">Last Name</label>
            <input type="text" class="form-input" id="lastName" placeholder="Doe" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-input" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="password-wrapper">
            <input type="password" class="form-input" id="password" placeholder="Min 8 characters" required minlength="8">
            <button type="button" class="password-toggle" onclick="togglePassword('password')">👁️</button>
          </div>
          <p class="password-hint">Must be at least 8 characters</p>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" class="form-input" id="confirmPassword" placeholder="Re-enter password" required>
            <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">👁️</button>
          </div>
        </div>

        <div class="checkbox-wrapper">
          <input type="checkbox" class="checkbox" id="terms" required>
          <label class="checkbox-label" for="terms">
            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
          </label>
        </div>

        <button type="submit" class="btn-create">Create Account</button>
      </form>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">Or sign up with</span>
        <div class="divider-line"></div>
      </div>

      <button class="btn-google" onclick="alert('Google Sign Up coming soon!')">
        <span>🔵</span> Continue with Google
      </button>

      <p class="login-text">
        Already have an account? <a href="login.html" class="login-link">Login</a>
      </p>
    </div>
  </div>

  <script>
    function togglePassword(id) {
      const input = document.getElementById(id);
      input.type = input.type === 'password'? 'text' : 'password';
    }

    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const firstName = document.getElementById('firstName').value;
      const lastName = document.getElementById('lastName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const terms = document.getElementById('terms').checked;

      if (password !== confirmPassword) {
        alert('Passwords do not match!');
        return;
      }

      if (!terms) {
        alert('Please agree to Terms of Service and Privacy Policy');
        return;
      }

      // Save to localStorage
      localStorage.setItem('userName', firstName + ' ' + lastName);
      localStorage.setItem('userEmail', email);
      localStorage.setItem('isLoggedIn', 'true');
      
      alert('Account created successfully!');
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
