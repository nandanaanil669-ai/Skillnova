<!DOCTYPE html>
<html>
<head>
  <title>SkillBot - SkillNova</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; background: #0d1117; color: white; margin: 0; padding: 20px; }
    .chat-box { max-width: 600px; margin: 0 auto; background: #161b22; border-radius: 12px; padding: 20px; }
    .messages { height: 400px; overflow-y: auto; border: 1px solid #30363d; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
    .msg { margin: 10px 0; }
    .user { text-align: right; color: #00bfff; }
    .bot { text-align: left; color: #7ee787; }
    input { width: 70%; padding: 10px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white; }
    button { width: 25%; padding: 10px; background: #00bfff; border: none; border-radius: 8px; color: black; font-weight: bold; cursor: pointer; }
    h2 { text-align: center; color: #00bfff; }
    .loading { color: #8b949e; font-style: italic; }
  </style>
</head>
<body>
  <div class="chat-box">
    <h2>🤖 SkillBot - Your AI Career Assistant</h2>
    <div class="messages" id="messages">
      <div class="msg bot">Hi! I'm SkillBot powered by Gemini 👋 Ask me about careers, skills, MBTI, or salaries!</div>
    </div>
    <input type="text" id="userInput" placeholder="Type your question..." onkeydown="if(event.key==='Enter') sendMsg()">
    <button onclick="sendMsg()">Send</button>
  </div>

  <script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('userInput');
    const API_URL = "https://v0-next-js-api-route-nine-alpha.vercel.app/api/chat";
    
    let chatHistory = [];

    async function sendMsg() {
      const text = input.value.trim();
      if (!text) return;
      
      // Show user message
      messages.innerHTML += `<div class="msg user">You: ${text}</div>`;
      input.value = '';
      messages.scrollTop = messages.scrollHeight;
      
      // Show loading
      const loadingId = Date.now();
      messages.innerHTML += `<div class="msg bot loading" id="${loadingId}">SkillBot is typing...</div>`;
      messages.scrollTop = messages.scrollHeight;
      
      // Add to history
      chatHistory.push({ role: "user", content: text });

      try {
        // Call Gemini API via Vercel
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: chatHistory })
        });

        if (!response.ok) throw new Error('API Error');
        
        const data = await response.json();
        const reply = data.text || "Sorry, I couldn't process that. Try again!";
        
        // Remove loading and show reply
        document.getElementById(loadingId).remove();
        messages.innerHTML += `<div class="msg bot">SkillBot: ${reply}</div>`;
        
        // Add to history
        chatHistory.push({ role: "model", content: reply });
        
      } catch (error) {
        document.getElementById(loadingId).remove();
        messages.innerHTML += `<div class="msg bot">SkillBot: Sorry, connection error. Please try again later! 😢</div>`;
      }
      
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>
</html>
