<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillNova - Progress Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0a111a; color: #fff; min-height: 100vh; padding: 100px 40px 40px; }
  .navbar { background: #0b131e; border-bottom: 1px solid #151e2d; padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; position: fixed; top: 0; left: 0; right: 0; z-index: 100; }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; cursor: pointer; text-decoration: none; color: #fff; }
  .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, #00bfff 0%, #0099ff 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #0a111a; }
  .nav-links { display: flex; gap: 32px; align-items: center; }
  .nav-link { color: #7a8699; text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.3s; padding: 8px 16px; border-radius: 8px; }
  .nav-link:hover,.nav-link.active { color: #00bfff; background: rgba(0, 191, 255, 0.1); }
  .user-section { display: flex; align-items: center; gap: 20px; }
  .user-name { font-size: 14px; font-weight: 600; color: #00bfff; }
  .logout-btn { padding: 8px 20px; background: transparent; border: 1px solid #1f2937; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
  .logout-btn:hover { background: #1f2937; border-color: #00bfff; }
  .container { max-width: 1200px; margin: 0 auto; }
  .page-header { margin-bottom: 40px; text-align: center; }
  .page-title { font-size: 36px; font-weight: 800; margin-bottom: 8px; background: linear-gradient(135deg, #00bfff 0%, #0099ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .page-subtitle { font-size: 16px; color: #7a8699; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 24px; margin-bottom: 40px; }
  .stat-card { background: linear-gradient(135deg, #0b131e 0%, #0a111a 100%); border: 1px solid #151e2d; border-radius: 16px; padding: 24px; }
  .stat-icon { font-size: 32px; margin-bottom: 12px; }
  .stat-value { font-size: 32px; font-weight: 800; margin-bottom: 4px; color: #00bfff; }
  .stat-label { font-size: 14px; color: #7a8699; }
  .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 24px; }
  .chart-card { background: linear-gradient(135deg, #0b131e 0%, #0a111a 100%); border: 1px solid #151e2d; border-radius: 16px; padding: 24px; }
  .chart-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
  .progress-bar { width: 100%; height: 12px; background: #1f2937; border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #00bfff 0%, #0099ff 100%); transition: width 0.5s ease; }
  .progress-text { font-size: 14px; color: #7a8699; text-align: right; }
  .empty-state { text-align: center; padding: 60px 20px; color: #7a8699; }
  .roadmap-list { margin-top: 16px; }
  .roadmap-item { background: #0f0f1a; border: 1px solid #2a2a4e; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .roadmap-name { font-weight: 600; }
  .roadmap-percent { color: #00bfff; font-weight: 700; }
    @media (max-width: 768px) {.nav-links { display: none; }.charts-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="home.html" class="logo">
      <div class="logo-icon">S</div>
      <span>SkillNova</span>
    </a>
    <div class="nav-links">
      <a class="nav-link" href="home.html">Home</a>
      <a class="nav-link" href="dashboard.html">Dashboard</a>
      <a class="nav-link" href="skills.html">Skills</a>
      <a class="nav-link" href="roadmap.html">Roadmap</a>
      <a class="nav-link active" href="progress.html">Progress</a>
      <a class="nav-link" href="salary.html">Salary</a>
      <a class="nav-link" href="personality.html">Personality</a>
    </div>
    <div class="user-section">
      <span class="user-name" id="userName">User</span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1 class="page-title">Progress Tracker</h1>
      <p class="page-subtitle">Track your learning journey and stay motivated</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">🎯</div>
        <div class="stat-value" id="skillsCount">0</div>
        <div class="stat-label">Skills Added</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">✅</div>
        <div class="stat-value" id="stepsCompleted">0</div>
        <div class="stat-label">Roadmap Steps Done</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🔥</div>
        <div class="stat-value" id="overallProgress">0%</div>
        <div class="stat-label">Overall Progress</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📅</div>
        <div class="stat-value" id="daysActive">1</div>
        <div class="stat-label">Days Active</div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <h3 class="chart-title">Overall Progress</h3>
        <canvas id="progressChart"></canvas>
      </div>
      <div class="chart-card">
        <h3 class="chart-title">Skills Distribution</h3>
        <canvas id="skillsChart"></canvas>
      </div>
    </div>

    <div class="chart-card" style="margin-top: 24px;">
      <h3 class="chart-title">All Roadmaps Progress</h3>
      <div id="roadmapProgress"></div>
      <div id="roadmapList" class="roadmap-list"></div>
    </div>
  </div>

  <script>
    if (localStorage.getItem('isLoggedIn')!== 'true') {
      window.location.href = 'home.html';
    }

    document.getElementById('userName').textContent = localStorage.getItem('userName') || 'User';

    function logout() {
      localStorage.clear();
      window.location.href = 'home.html';
    }

    // ROADMAP DATA - NINTE ROADMAP.HTML IL ULLA STEPS
    const roadmaps = {
      frontend: { name: "Frontend Developer", total: 4 },
      backend: { name: "Backend Developer", total: 4 },
      fullstack: { name: "Full Stack Developer", total: 4 },
      datascience: { name: "Data Scientist", total: 4 },
      uiux: { name: "UI/UX Designer", total: 4 }
    };

    function loadProgress() {
      // 1. Skills count
      const addedSkills = JSON.parse(localStorage.getItem('addedSkills')) || [];
      document.getElementById('skillsCount').textContent = addedSkills.length;

      // 2. Calculate completed steps for all goals
      let totalCompleted = 0;
      let totalStepsAll = 0;
      let roadmapHTML = '';

      Object.keys(roadmaps).forEach(goal => {
        const key = `skillnova_${goal}_completed`;
        const completed = JSON.parse(localStorage.getItem(key)) || [];
        const total = roadmaps[goal].total;
        totalCompleted += completed.length;
        totalStepsAll += total;

        if (completed.length > 0) {
          const percent = Math.round((completed.length / total) * 100);
          roadmapHTML += `
            <div class="roadmap-item">
              <span class="roadmap-name">${roadmaps[goal].name}</span>
              <span class="roadmap-percent">${completed.length}/${total} - ${percent}%</span>
            </div>
          `;
        }
      });

      document.getElementById('stepsCompleted').textContent = totalCompleted;

      // 3. Overall Progress
      const progressPercent = totalStepsAll > 0 ? Math.round((totalCompleted / totalStepsAll) * 100) : 0;
      document.getElementById('overallProgress').textContent = progressPercent + '%';

      // 4. Days active
      const joinDate = localStorage.getItem('joinDate') || new Date().toISOString();
      if (!localStorage.getItem('joinDate')) localStorage.setItem('joinDate', joinDate);
      const daysActive = Math.max(1, Math.ceil((new Date() - new Date(joinDate)) / (1000 * 60 * 60 * 24)));
      document.getElementById('daysActive').textContent = daysActive;

      // 5. Progress Chart
      const ctx1 = document.getElementById('progressChart');
      if (window.progressChartInstance) window.progressChartInstance.destroy();
      window.progressChartInstance = new Chart(ctx1, {
        type: 'doughnut',
        data: {
          labels: ['Completed', 'Remaining'],
          datasets: [{
            data: [totalCompleted, totalStepsAll - totalCompleted],
            backgroundColor: ['#00bfff', '#1f2937'],
            borderWidth: 0
          }]
        },
        options: {
          plugins: {
            legend: { labels: { color: '#7a8699' } }
          }
        }
      });

      // 6. Skills Chart
      const skillCategories = {};
      addedSkills.forEach(skill => {
        const category = skill.includes('JS') || skill.includes('HTML') || skill.includes('CSS') || skill.includes('React')? 'Frontend' :
                        skill.includes('Node') || skill.includes('Mongo') || skill.includes('SQL') || skill.includes('Express')? 'Backend' : 'Other';
        skillCategories[category] = (skillCategories[category] || 0) + 1;
      });

      const ctx2 = document.getElementById('skillsChart');
      if (window.skillsChartInstance) window.skillsChartInstance.destroy();
      window.skillsChartInstance = new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: Object.keys(skillCategories),
          datasets: [{
            label: 'Skills',
            data: Object.values(skillCategories),
            backgroundColor: '#00bfff',
            borderRadius: 8
          }]
        },
        options: {
          scales: {
            y: { ticks: { color: '#7a8699' }, grid: { color: '#1f2937' } },
            x: { ticks: { color: '#7a8699' }, grid: { display: false } }
          },
          plugins: { legend: { display: false } }
        }
      });

      // 7. Roadmap Progress Bar
      const roadmapDiv = document.getElementById('roadmapProgress');
      const roadmapList = document.getElementById('roadmapList');
      
      if (totalCompleted === 0) {
        roadmapDiv.innerHTML = '<div class="empty-state">No roadmap started yet. Go to Roadmap page to begin!</div>';
        roadmapList.innerHTML = '';
      } else {
        roadmapDiv.innerHTML = `
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${progressPercent}%"></div>
          </div>
          <div class="progress-text">${totalCompleted} of ${totalStepsAll} steps completed - ${progressPercent}%</div>
        `;
        roadmapList.innerHTML = roadmapHTML;
      }
    }

    // Load on page open
    loadProgress();
    
    // Page il thirichu vannal update aavan
    window.addEventListener('focus', loadProgress);
  </script>
</body>
</html>
