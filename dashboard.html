<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillNova - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #0a0f1e;
            color: #fff;
            min-height: 100vh;
        }

        /* NAVBAR - NINTE PAZHAYA TOP BAR */
       .navbar {
            background: #0d1425;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e2a47;
            position: sticky;
            top: 0;
            z-index: 100;
        }
       .nav-left {
            display: flex;
            gap: 30px;
        }
       .nav-left a {
            color: #8b9bb4;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: 0.3s;
        }
       .nav-left a:hover,.nav-left a.active {
            color: #3b82f6;
        }
       .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
       .nav-right span {
            color: #3b82f6;
            font-weight: 600;
        }
       .nav-right button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }
       .nav-right button:hover {
            background: #2563eb;
        }

        /* DASHBOARD CONTENT */
       .dashboard-container {
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }
       .welcome-text h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }
       .welcome-text p {
            color: #8b9bb4;
            margin-bottom: 40px;
        }

       .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
       .card {
            background: #131b2e;
            border: 1px solid #1e2a47;
            border-radius: 12px;
            padding: 25px;
        }
       .card h3 {
            color: #3b82f6;
            font-size: 14px;
            margin-bottom: 15px;
        }
       .card.number {
            font-size: 36px;
            font-weight: 700;
            margin: 10px 0;
        }

        /* CHATBOT ICON */
       .chatbot-icon {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: #3b82f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
            z-index: 999;
        }

        /* CHATBOT BOX */
       .chatbot-box {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 380px;
            height: 500px;
            background: #131b2e;
            border: 1px solid #1e2a47;
            border-radius: 16px;
            display: none;
            flex-direction: column;
            z-index: 998;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
       .chat-header {
            background: #3b82f6;
            padding: 15px 20px;
            border-radius: 16px 16px 0 0;
            font-weight: 600;
        }
       .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
       .user,.bot {
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 80%;
            word-wrap: break-word;
        }
       .user {
            background: #3b82f6;
            align-self: flex-end;
        }
       .bot {
            background: #1e2a47;
            align-self: flex-start;
        }
       .chat-input {
            display: flex;
            padding: 15px;
            border-top: 1px solid #1e2a47;
            gap: 10px;
        }
       .chat-input input {
            flex: 1;
            background: #0d1425;
            border: 1px solid #1e2a47;
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            outline: none;
        }
       .chat-input button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- TOP NAV BAR -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="home.html">Home</a>
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="#skills">Skills</a>
            <a href="#roadmap">Roadmap</a>
            <a href="#progress">Progress</a>
            <a href="#salary">Salary</a>
            <a href="#personality">Personality</a>
        </div>
        <div class="nav-right">
            <span id="userName">Nandana</span>
            <button onclick="logout()">Logout</button>
        </div>
    </nav>

    <!-- DASHBOARD CONTENT -->
    <div class="dashboard-container">
        <div class="welcome-text">
            <h1>Welcome back, <span id="welcomeName">Nandana</span>! 👋</h1>
            <p>Continue your learning journey and track your progress</p>
        </div>

        <div class="cards-grid">
            <div class="card">
                <h3>COURSES COMPLETED</h3>
                <div class="number">12</div>
            </div>
            <div class="card">
                <h3>SKILLS MASTERED</h3>
                <div class="number">8</div>
            </div>
            <div class="card">
                <h3>LEARNING STREAK</h3>
                <div class="number">15 Days</div>
            </div>
            <div class="card">
                <h3>ACHIEVEMENTS</h3>
                <div class="number">24</div>
            </div>
        </div>
    </div>

    <!-- CHATBOT ICON -->
    <div class="chatbot-icon" onclick="toggleChat()">🤖</div>

    <!-- CHATBOT BOX -->
    <div class="chatbot-box" id="chatBox">
        <div class="chat-header">SkillNova AI Assistant</div>
        <div class="chat-messages" id="chatMessages">
            <div class="bot">Hi Nandana! How can I help you today? 😊</div>
        </div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Ask me anything..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // ⚠️ PUDHIYA GEMINI API KEY IVDE VEKKU - Replace this line
        const GEMINI_API_KEY = 'AIzaSyBTSbmTw9Mo_qe8doy-EwXV3rRidMdc9PA';
        const GEMINI_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent';

        // Get username from login
        const user = localStorage.getItem('skillnova_user') || 'Nandana';
        document.getElementById('userName').innerText = user;
        document.getElementById('welcomeName').innerText = user;

        function toggleChat() {
            const box = document.getElementById('chatBox');
            box.style.display = box.style.display === 'flex'? 'none' : 'flex';
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const msg = input.value.trim();
            if (!msg) return;

            if (GEMINI_API_KEY === 'PASTE_YOUR_NEW_API_KEY_HERE' ||!GEMINI_API_KEY) {
                addMsg('Please add your Gemini API key in the code first!', 'bot');
                return;
            }

            addMsg(msg, 'user');
            input.value = '';

            try {
                const response = await fetch(GEMINI_URL + '?key=' + GEMINI_API_KEY, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: msg }] }]
                    })
                });

                if (!response.ok) throw new Error('API Error');

                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;
                addMsg(reply, 'bot');
            } catch (error) {
                addMsg('Sorry, something went wrong. Check your API key.', 'bot');
            }
        }

        function addMsg(text, type) {
            const div = document.createElement('div');
            div.className = type;
            div.innerText = text;
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function logout() {
            localStorage.removeItem('skillnova_user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
