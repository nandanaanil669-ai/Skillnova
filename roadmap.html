<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap - SkillNova</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0a14; color: #e0e0ff; min-height: 100vh; }
      .navbar { background: #0f0f1a; padding: 15px 60px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a1a2e; position: sticky; top: 0; z-index: 100; }
      .logo { font-size: 22px; font-weight: 700; background: linear-gradient(90deg, #8a2be2, #00bfff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .nav-links { display: flex; gap: 35px; list-style: none; }
      .nav-links a { color: #b8b8ff; text-decoration: none; font-size: 15px; font-weight: 500; transition: 0.3s; padding: 8px 16px; border-radius: 6px; }
      .nav-links a:hover,.nav-links a.active { color: #fff; background: #1a1a2e; }
      .nav-links a.active { background: #8a2be2; }
      .logout-btn { padding: 8px 16px; background: #1a1a2e; border: 1px solid #2a2a4e; border-radius: 6px; color: #ff6b6b; cursor: pointer; font-size: 14px; }
      .container { max-width: 1000px; margin: 0 auto; padding: 60px 40px; }
      .page-header { text-align: center; margin-bottom: 50px; }
      .page-header h1 { font-size: 42px; margin-bottom: 12px; background: linear-gradient(90deg, #00bfff, #8a2be2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .page-header p { color: #b8b8ff; font-size: 16px; }
      .goal-card { background: #1a1a2e; border: 1px solid #2a2a4e; border-radius: 12px; padding: 30px; margin-bottom: 40px; }
      .goal-card h3 { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 18px; }
      .goal-select { width: 100%; padding: 14px; background: #0f0f1a; border: 1px solid #2a2a4e; border-radius: 8px; color: #fff; font-size: 15px; margin-bottom: 20px; }
      .generate-btn { width: 100%; padding: 15px; background: linear-gradient(90deg, #00bfff, #8a2be2); border: none; border-radius: 8px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; }
      .generate-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(138, 43, 226, 0.4); }
      .roadmap-step { background: #1a1a2e; border: 1px solid #2a2a4e; border-left: 4px solid #00bfff; border-radius: 8px; padding: 25px; margin-bottom: 20px; position: relative; animation: slideIn 0.5s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
      .step-tag { display: inline-block; background: #00bfff; color: #0a0a14; padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: 700; margin-bottom: 12px; }
      .roadmap-step h4 { font-size: 20px; margin-bottom: 8px; }
      .roadmap-step p { color: #b8b8ff; line-height: 1.6; margin-bottom: 15px; }
      .skill-tags { display: flex; gap: 10px; flex-wrap: wrap; }
      .tag { background: #0f0f1a; border: 1px solid #2a2a4e; padding: 6px 12px; border-radius: 6px; font-size: 13px; color: #00bfff; }
      .loading { text-align: center; padding: 40px; color: #8a2be2; font-size: 18px; }
       /* CHECKBOX INU MATHRAM KODUTHA CSS */
      .step-header { display: flex; align-items: center; gap: 15px; margin-bottom: 12px; }
      .step-checkbox { width: 22px; height: 22px; accent-color: #00bfff; cursor: pointer; }
      .completed h4 { text-decoration: line-through; opacity: 0.6; }
      .completed { border-left-color: #00ff88; }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem('isLoggedIn')!== 'true') {
            window.location.href = 'login.html';
        }
    </script>

    <nav class="navbar">
        <div class="logo">SkillNova</div>
        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="skills.html">Skills</a></li>
            <li><a href="roadmap.html" class="active">Roadmap</a></li>
            <li><a href="progress.html">Progress</a></li>
            <li><a href="salary.html">Salary</a></li>
        </ul>
        <div class="user-menu">
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Career Roadmap</h1>
            <p>Your personalized step-by-step learning path</p>
        </div>

        <div class="goal-card">
            <h3>🎯 Select Your Career Goal</h3>
            <select class="goal-select" id="careerGoal">
                <option value="frontend">Frontend Developer</option>
                <option value="backend">Backend Developer</option>
                <option value="fullstack">Full Stack Developer</option>
                <option value="datascience">Data Scientist</option>
                <option value="uiux">UI/UX Designer</option>
            </select>
            <button class="generate-btn" onclick="generateRoadmap()">Generate My Roadmap 🚀</button>
        </div>

        <div id="roadmapSteps"></div>
    </div>

    <script>
        const roadmaps = {
            frontend: [
                { step: 1, title: "HTML5 & CSS3 Mastery", desc: "Deep dive into semantic HTML and modern CSS. Flexbox, Grid, animations, responsive design.", tags: ["HTML5", "CSS3", "Responsive"] },
                { step: 2, title: "JavaScript Fundamentals", desc: "Master ES6+, DOM manipulation, async/await, APIs, and modern JS concepts.", tags: ["JavaScript", "ES6", "DOM", "APIs"] },
                { step: 3, title: "React.js & Ecosystem", desc: "Build dynamic UIs with React, Hooks, Context API, React Router, and state management.", tags: ["React", "Hooks", "Redux", "Router"] },
                { step: 4, title: "Version Control & Deployment", desc: "Git, GitHub, CI/CD, and deploying apps to Vercel, Netlify, or AWS.", tags: ["Git", "GitHub", "Vercel", "CI/CD"] }
            ],
            backend: [
                { step: 1, title: "Node.js & Express.js", desc: "Build scalable server-side apps with Node.js, Express, REST APIs, and middleware.", tags: ["Node.js", "Express", "REST API"] },
                { step: 2, title: "Databases: SQL & NoSQL", desc: "Master PostgreSQL, MongoDB, database design, queries, and ORMs like Prisma.", tags: ["PostgreSQL", "MongoDB", "Prisma"] },
                { step: 3, title: "Authentication & Security", desc: "JWT, OAuth, bcrypt, rate limiting, and securing APIs against common vulnerabilities.", tags: ["JWT", "OAuth", "Security"] },
                { step: 4, title: "Cloud & DevOps Basics", desc: "Deploy to AWS, Docker containers, basic Kubernetes, and monitoring.", tags: ["AWS", "Docker", "DevOps"] }
            ],
            fullstack: [
                { step: 1, title: "Frontend Foundation", desc: "HTML, CSS, JavaScript ES6+, and React.js for building interactive UIs.", tags: ["HTML", "CSS", "JS", "React"] },
                { step: 2, title: "Backend with Node.js", desc: "Express.js, REST APIs, authentication, and connecting to databases.", tags: ["Node.js", "Express", "API"] },
                { step: 3, title: "Database & ORM", desc: "PostgreSQL/MongoDB, Prisma ORM, and designing scalable schemas.", tags: ["PostgreSQL", "MongoDB", "Prisma"] },
                { step: 4, title: "Full Stack Integration", desc: "Connect frontend + backend, deploy full stack apps, and CI/CD pipelines.", tags: ["MERN", "Deployment", "CI/CD"] }
            ],
            datascience: [
                { step: 1, title: "Python for Data Science", desc: "Master Python, NumPy, Pandas for data manipulation and analysis.", tags: ["Python", "NumPy", "Pandas"] },
                { step: 2, title: "Data Visualization", desc: "Matplotlib, Seaborn, Plotly, and creating insightful dashboards.", tags: ["Matplotlib", "Seaborn", "Plotly"] },
                { step: 3, title: "Machine Learning Basics", desc: "Scikit-learn, regression, classification, clustering, and model evaluation.", tags: ["ML", "Scikit-learn", "Models"] },
                { step: 4, title: "Deep Learning & AI", desc: "TensorFlow/PyTorch, Neural Networks, NLP, and deploying ML models.", tags: ["TensorFlow", "PyTorch", "AI"] }
            ],
            uiux: [
                { step: 1, title: "Design Fundamentals", desc: "Color theory, typography, layout, visual hierarchy, and design principles.", tags: ["Design", "Color", "Typography"] },
                { step: 2, title: "Figma & Prototyping", desc: "Master Figma, wireframing, interactive prototypes, and design systems.", tags: ["Figma", "Prototype", "Wireframe"] },
                { step: 3, title: "UX Research", desc: "User interviews, personas, user journey mapping, usability testing.", tags: ["UX Research", "Personas", "Testing"] },
                { step: 4, title: "Portfolio & Case Studies", desc: "Build a stunning portfolio with 3-4 detailed case studies and ship designs.", tags: ["Portfolio", "Case Study"] }
            ]
        };

        function logout() {
            localStorage.removeItem('isLoggedIn');
            window.location.href = 'login.html';
        }

        function toggleStep(goal, stepId) {
            const key = `skillnova_${goal}_completed`;
            let completedSteps = JSON.parse(localStorage.getItem(key)) || [];

            if (completedSteps.includes(stepId)) {
                completedSteps = completedSteps.filter(id => id!== stepId);
            } else {
                completedSteps.push(stepId);
            }
            localStorage.setItem(key, JSON.stringify(completedSteps));

            const stepElement = document.querySelector(`[data-goal="${goal}"][data-step="${stepId}"]`);
            if (stepElement) {
                if (completedSteps.includes(stepId)) {
                    stepElement.classList.add('completed');
                } else {
                    stepElement.classList.remove('completed');
                }
            }
        }

        function generateRoadmap() {
            const goal = document.getElementById('careerGoal').value;
            const stepsContainer = document.getElementById('roadmapSteps');
            const key = `skillnova_${goal}_completed`;
            const completedSteps = JSON.parse(localStorage.getItem(key)) || [];

            stepsContainer.innerHTML = '<div class="loading">Generating your roadmap... 🚀</div>';

            setTimeout(() => {
                const selectedRoadmap = roadmaps[goal];
                stepsContainer.innerHTML = '';

                selectedRoadmap.forEach((item, index) => {
                    setTimeout(() => {
                        const isCompleted = completedSteps.includes(item.step);
                        const stepHTML = `
                            <div class="roadmap-step ${isCompleted? 'completed' : ''}" data-goal="${goal}" data-step="${item.step}">
                                <div class="step-header">
                                    <input type="checkbox" class="step-checkbox" ${isCompleted? 'checked' : ''}
                                           onchange="toggleStep('${goal}', ${item.step})">
                                    <span class="step-tag">STEP ${item.step}</span>
                                </div>
                                <h4>${item.title}</h4>
                                <p>${item.desc}</p>
                                <div class="skill-tags">
                                    ${item.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                                </div>
                            </div>
                        `;
                        stepsContainer.innerHTML += stepHTML;
                    }, index * 200);
                });
            }, 800);
        }

        window.onload = function() {
            generateRoadmap();
        }
    </script>
</body>
</html>
