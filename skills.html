<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillNova - Explore Skills</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0a111a; color: #fff; min-height: 100vh; padding: 100px 40px 40px; }
 .navbar { background: #0b131e; border-bottom: 1px solid #151e2d; padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; position: fixed; top: 0; left: 0; right: 0; z-index: 100; }
 .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; cursor: pointer; text-decoration: none; color: #fff; }
 .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, #00bfff 0%, #0099ff 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #0a111a; }
 .nav-links { display: flex; gap: 32px; align-items: center; }
 .nav-link { color: #7a8699; text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.3s; padding: 8px 16px; border-radius: 8px; }
 .nav-link:hover, .nav-link.active { color: #00bfff; background: rgba(0, 191, 255, 0.1); }
 .user-section { display: flex; align-items: center; gap: 20px; }
 .user-name { font-size: 14px; font-weight: 600; color: #00bfff; }
 .logout-btn { padding: 8px 20px; background: transparent; border: 1px solid #1f2937; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
 .logout-btn:hover { background: #1f2937; border-color: #00bfff; }
 .container { max-width: 1200px; margin: 0 auto; }
 .page-header { margin-bottom: 40px; }
 .page-title { font-size: 36px; font-weight: 800; margin-bottom: 8px; background: linear-gradient(135deg, #00bfff 0%, #0099ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
 .page-subtitle { font-size: 16px; color: #7a8699; }
 .filter-bar { display: flex; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
 .search-box { flex: 1; min-width: 250px; padding: 14px 18px; background: #0b131e; border: 1px solid #1f2937; border-radius: 12px; color: #fff; font-size: 15px; outline: none; }
 .search-box:focus { border-color: #00bfff; box-shadow: 0 0 0 3px rgba(0, 191, 255, 0.1); }
 .filter-btn { padding: 14px 24px; background: #0b131e; border: 1px solid #1f2937; border-radius: 12px; color: #7a8699; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
 .filter-btn:hover, .filter-btn.active { background: rgba(0, 191, 255, 0.1); border-color: #00bfff; color: #00bfff; }
 .skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
 .skill-card { background: linear-gradient(135deg, #0b131e 0%, #0a111a 100%); border: 1px solid #151e2d; border-radius: 20px; padding: 28px; transition: all 0.3s; cursor: pointer; }
 .skill-card:hover { transform: translateY(-4px); border-color: #00bfff; box-shadow: 0 8px 32px rgba(0, 191, 255, 0.2); }
 .skill-icon { width: 56px; height: 56px; background: rgba(0, 191, 255, 0.1); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 20px; }
 .skill-name { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
 .skill-category { display: inline-block; padding: 4px 12px; background: rgba(0, 191, 255, 0.1); border-radius: 6px; font-size: 12px; font-weight: 600; color: #00bfff; margin-bottom: 12px; }
 .skill-desc { font-size: 14px; color: #7a8699; line-height: 1.6; margin-bottom: 20px; }
 .skill-footer { display: flex; justify-content: space-between; align-items: center; }
 .skill-level { font-size: 13px; color: #7a8699; }
 .btn-add { padding: 8px 16px; background: linear-gradient(135deg, #00bfff 0%, #0099ff 100%); border: none; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
 .btn-add:hover { transform: scale(1.05); }
 .btn-add.added { background: #1f2937; border: 1px solid #00bfff; }
 .btn-add.added:hover { background: #ff4444; border-color: #ff4444; }
    @media (max-width: 768px) { .nav-links { display: none; } .navbar { padding: 16px 24px; } body { padding: 100px 20px 40px; } .skills-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="home.html" class="logo">
      <div class="logo-icon">S</div>
      <span>SkillNova</span>
    </a>
    <div class="nav-links">
      <a class="nav-link" href="home.html">Home</a>
      <a class="nav-link" href="dashboard.html">Dashboard</a>
      <a class="nav-link active" href="skills.html">Skills</a>
      <a class="nav-link" href="roadmap.html">Roadmap</a>
      <a class="nav-link" href="progress.html">Progress</a>
      <a class="nav-link" href="salary.html">Salary</a>
      <a class="nav-link" href="personality.html">Personality</a>
    </div>
    <div class="user-section">
      <span class="user-name" id="userName">User</span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1 class="page-title">Explore Skills</h1>
      <p class="page-subtitle">Discover trending skills and add them to your learning path</p>
    </div>

    <div class="filter-bar">
      <input type="text" class="search-box" id="searchBox" placeholder="Search skills... 🔍">
      <button class="filter-btn active" onclick="filterSkills('all')">All</button>
      <button class="filter-btn" onclick="filterSkills('tech')">Tech</button>
      <button class="filter-btn" onclick="filterSkills('design')">Design</button>
      <button class="filter-btn" onclick="filterSkills('business')">Business</button>
    </div>

    <div class="skills-grid" id="skillsGrid"></div>
  </div>

  <script>
    if (localStorage.getItem('isLoggedIn') !== 'true') {
      window.location.href = 'home.html';
    }
    
    document.getElementById('userName').textContent = localStorage.getItem('userName') || 'User';

    function logout() {
      localStorage.clear();
      window.location.href = 'home.html';
    }

    const skillsData = [
      { id: 1, name: 'Python', category: 'tech', icon: '🐍', desc: 'Most popular language for AI, data science, and automation.', level: 'Beginner to Advanced' },
      { id: 2, name: 'React.js', category: 'tech', icon: '⚛️', desc: 'Build modern, interactive web applications with components.', level: 'Intermediate' },
      { id: 3, name: 'UI/UX Design', category: 'design', icon: '🎨', desc: 'Design beautiful and user-friendly interfaces.', level: 'Beginner' },
      { id: 4, name: 'Digital Marketing', category: 'business', icon: '📈', desc: 'Master SEO, social media, and content marketing.', level: 'Beginner' },
      { id: 5, name: 'Machine Learning', category: 'tech', icon: '🤖', desc: 'Build AI models that learn from data.', level: 'Advanced' },
      { id: 6, name: 'Figma', category: 'design', icon: '✏️', desc: 'Industry standard tool for interface design and prototyping.', level: 'Beginner' },
      { id: 7, name: 'Data Analytics', category: 'business', icon: '📊', desc: 'Analyze data to drive business decisions.', level: 'Intermediate' },
      { id: 8, name: 'Node.js', category: 'tech', icon: '🟢', desc: 'Build scalable backend services with JavaScript.', level: 'Intermediate' },
      { id: 9, name: 'Product Management', category: 'business', icon: '🎯', desc: 'Lead product development from idea to launch.', level: 'Advanced' }
    ];

    let addedSkills = JSON.parse(localStorage.getItem('addedSkills')) || [];

    function renderSkills(skills) {
      const grid = document.getElementById('skillsGrid');
      grid.innerHTML = skills.map(skill => `
        <div class="skill-card" data-category="${skill.category}">
          <div class="skill-icon">${skill.icon}</div>
          <h3 class="skill-name">${skill.name}</h3>
          <span class="skill-category">${skill.category.toUpperCase()}</span>
          <p class="skill-desc">${skill.desc}</p>
          <div class="skill-footer">
            <span class="skill-level">📚 ${skill.level}</span>
            <button class="btn-add ${addedSkills.includes(skill.id)? 'added' : ''}" 
                    onclick="toggleSkill(${skill.id}, this)"
                    onmouseenter="this.textContent = addedSkills.includes(${skill.id})? 'Remove ✕' : this.textContent"
                    onmouseleave="this.textContent = addedSkills.includes(${skill.id})? 'Added ✓' : '+ Add Skill'">
              ${addedSkills.includes(skill.id)? 'Added ✓' : '+ Add Skill'}
            </button>
          </div>
        </div>
      `).join('');
    }

    function toggleSkill(id, btn) {
      const index = addedSkills.indexOf(id);
      
      if (index === -1) {
        // Add skill
        addedSkills.push(id);
        btn.textContent = 'Added ✓';
        btn.classList.add('added');
      } else {
        // Remove skill
        addedSkills.splice(index, 1);
        btn.textContent = '+ Add Skill';
        btn.classList.remove('added');
      }
      localStorage.setItem('addedSkills', JSON.stringify(addedSkills));
    }

    function filterSkills(category) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      
      const filtered = category === 'all'? skillsData : skillsData.filter(s => s.category === category);
      renderSkills(filtered);
    }

    document.getElementById('searchBox').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = skillsData.filter(s => 
        s.name.toLowerCase().includes(query) || s.desc.toLowerCase().includes(query)
      );
      renderSkills(filtered);
    });

    renderSkills(skillsData);
  </script>
</body>
</html>
