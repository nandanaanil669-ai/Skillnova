<!DOCTYPE html>
<html>
<head>
  <title>SkillBot - SkillNova</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; background: #0d1117; color: white; margin: 0; padding: 20px; }
    .chat-box { max-width: 600px; margin: 0 auto; background: #161b22; border-radius: 12px; padding: 20px; }
    .messages { height: 400px; overflow-y: auto; border: 1px solid #30363d; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
    .msg { margin: 10px 0; }
    .user { text-align: right; color: #00bfff; }
    .bot { text-align: left; color: #7ee787; }
    input { width: 70%; padding: 10px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white; }
    button { width: 25%; padding: 10px; background: #00bfff; border: none; border-radius: 8px; color: black; font-weight: bold; cursor: pointer; }
    h2 { text-align: center; color: #00bfff; }
  </style>
</head>
<body>
  <div class="chat-box">
    <h2>🤖 SkillBot - Your Career Assistant</h2>
    <div class="messages" id="messages">
      <div class="msg bot">Hi! I'm SkillBot 👋 Ask me about careers, skills, or MBTI types!</div>
    </div>
    <input type="text" id="userInput" placeholder="Type your question..." onkeydown="if(event.key==='Enter') sendMsg()">
    <button onclick="sendMsg()">Send</button>
  </div>

  <script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('userInput');

    function sendMsg() {
      const text = input.value.trim();
      if (!text) return;
      
      // Show user message
      messages.innerHTML += `<div class="msg user">You: ${text}</div>`;
      input.value = '';
      
      // Bot reply logic - simple if-else
      let reply = "Sorry, I can help with careers, skills, MBTI, and salary. Try asking: 'Best career for ISTJ?'";
      text_lower = text.toLowerCase();
      
      if (text_lower.includes('hello') || text_lower.includes('hi')) {
        reply = "Hello! How can I help you with your career today?";
      } 
      else if (text_lower.includes('istj') || text_lower.includes('logistician')) {
        reply = "ISTJ - The Logistician! Best careers: QA Engineer, Database Admin, Accountant. You're practical & reliable!";
      }
      else if (text_lower.includes('enfp')) {
        reply = "ENFP - The Campaigner! Best careers: Marketing, Content Creator, HR. You're creative & energetic!";
      }
      else if (text_lower.includes('salary') || text_lower.includes('frontend')) {
        reply = "Frontend Developer Salary in India: Fresher ₹6-10 LPA, Mid ₹12-18 LPA, Senior ₹20-35 LPA. Check Salary Predictor page!";
      }
      else if (text_lower.includes('roadmap')) {
        reply = "Go to Learning Roadmap page, select your career, and get 5 steps to become job-ready!";
      }
      else if (text_lower.includes('skill')) {
        reply = "Add your skills in Skill Gap Analysis page. We track Technical, Soft, and Tools categories!";
      }
      else if (text_lower.includes('thank')) {
        reply = "You're welcome! Keep learning with SkillNova 🚀";
      }

      setTimeout(() => {
        messages.innerHTML += `<div class="msg bot">SkillBot: ${reply}</div>`;
        messages.scrollTop = messages.scrollHeight;
      }, 500);
    }
  </script>
</body>
</html>s
